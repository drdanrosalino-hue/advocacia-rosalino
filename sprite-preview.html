<!doctype html><meta charset="utf-8"><title>Assets 3D</title><style>body{margin:0;background:#222;color:#fff;font:14px sans-serif}.g{display:grid;grid-template-columns:repeat(4,256px);gap:12px;padding:20px}.c{width:256px;height:256px;background-repeat:no-repeat;background-size:400% 400%;border:1px solid #777;position:relative}.c b{position:absolute;top:5px;left:5px;background:#000c;padding:5px}</style><div class="g" id="g"></div><script>(async()=>{const p=await Promise.all([1,2,3,4].map(n=>fetch(`assets3d-${n}.txt`).then(r=>r.text())));const u='data:image/webp;base64,'+p.join('');const g=document.querySelector('#g');for(let i=0;i<16;i++){let d=document.createElement('div');d.className='c';d.style.backgroundImage=`url(${u})`;d.style.backgroundPosition=`${(i%4)*33.333}% ${Math.floor(i/4)*33.333}%`;d.innerHTML=`<b>${i}</b>`;g.appendChild(d)}})()</script>
